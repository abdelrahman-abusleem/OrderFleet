name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore OrderFleet.slnx
      - run: dotnet tool restore
      - run: dotnet format OrderFleet.slnx --verify-no-changes --no-restore --verbosity quiet
      - run: dotnet build OrderFleet.slnx -c Release --no-restore -warnaserror
      - name: Dependency vulnerability audit
        shell: pwsh
        run: ./scripts/Verify-Dependencies.ps1
      - name: EF model drift
        env:
          ConnectionStrings__OrderFleet: Host=127.0.0.1;Port=1;Database=design_only;Username=design_only
        run: dotnet ef migrations has-pending-model-changes --project src/OrderFleet.Infrastructure --startup-project src/OrderFleet.Api --configuration Release --no-build
      - run: dotnet test tests/OrderFleet.Domain.Tests -c Release --no-build --no-restore
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: docker info
      - run: dotnet restore OrderFleet.slnx
      - run: dotnet tool restore
      - run: dotnet test tests/OrderFleet.IntegrationTests -c Release --no-restore --logger trx --results-directory TestResults
      - name: Fresh migration chain
        shell: pwsh
        run: ./scripts/Verify-Migrations.ps1
      - name: Clean Compose bootstrap and HTTP journey
        shell: pwsh
        run: |
          $env:API_PORT='0'; $env:POSTGIS_PORT='0'; $env:RABBITMQ_PORT='0'; $env:RABBITMQ_MANAGEMENT_PORT='0'
          ./scripts/Bootstrap.ps1 -ProjectName orderfleet-ci
          $address=(docker compose --project-name orderfleet-ci --profile app port api 8080).Trim()
          ./scripts/Invoke-Demo.ps1 -BaseUrl "http://$address"
      - name: Remove only this job's disposable Compose stack
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path .env) { docker compose --project-name orderfleet-ci --profile app down --volumes }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: TestResults
